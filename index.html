<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد بالعيادة</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #1a73e8; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background: #1a73e8; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 20px; font-weight: bold; }
        button:hover { background: #1557b0; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>➡️ حجز موعد جديد</h2>
        <form id="bookingForm">
            <label>اسم المريض بالكامل:</label>
            <input type="text" id="patientName" required placeholder="أدخل اسمك ثلاثي">

            <label>رقم الهاتف:</label>
            <input type="tel" id="patientPhone" required placeholder="01xxxxxxxxx">

            <label>تاريخ الحجز:</label>
            <input type="date" id="bookingDate" required>

            <label>الوقت المفضل:</label>
            <select id="bookingTime">
                <option>04:00 مساءً</option>
                <option>05:00 مساءً</option>
                <option>06:00 مساءً</option>
                <option>07:00 مساءً</option>
            </select>

            <button type="submit">تأكيد الحجز الفوري</button>
        </form>
    </div>

    <script>
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbwv8qy7dM9ze7NswA6_IUSoSBMTND3k7dmm16YGHyR7tg8RYx_1sklf9tikZeZyVFUS/exec';

document.getElementById('bookingForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    // تحويل البيانات لشكل يسهل على جوجل شيت استقباله دون قيود الحماية
    const name = document.getElementById('patientName').value;
    const phone = document.getElementById('patientPhone').value;
    const date = document.getElementById('bookingDate').value;
    const time = document.getElementById('bookingTime').value;

    // استخدام الرابط المباشر بالإرسال لتفادي مشاكل الـ CORS
    fetch(`${scriptUrl}?action=book&name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}&date=${encodeURIComponent(date)}&time=${encodeURIComponent(time)}`, {
        method: 'GET' // تحويلها لـ GET لتخطي حظر المتصفحات على جيت هب
    }).then(() => {
        alert('✨ تم إرسال حجزك بنجاح وتسجيله في الجوجل شيت!');
        document.getElementById('bookingForm').reset();
    }).catch(err => alert('خطأ في الاتصال بالسيرفر'));
});

    </script>
</body>
</html>
